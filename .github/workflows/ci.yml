name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Ruff covers the whole repo (src, tests, migrations); mypy stays
      # scoped to src -- test fixtures use a dict-of-overrides builder
      # pattern (see tests/fixtures/builders.py) that mypy can't type
      # through **kwargs-into-dataclass expansion without a speculative
      # typing layer this POC doesn't need.
      - name: Static checks (ruff)
        run: ruff check .

      - name: Type checks (mypy)
        run: mypy src

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: policyguard
          POSTGRES_PASSWORD: policyguard
          POSTGRES_DB: policyguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policyguard -d policyguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POLICYGUARD_DATABASE_URL: postgresql+psycopg://policyguard:policyguard@localhost:5432/policyguard_test
      POLICYGUARD_AI_PROVIDER: mock
      POLICYGUARD_KILL_SWITCH_DEFAULT_MODE: normal
      POLICYGUARD_ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run test suite against real PostgreSQL
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t policyguard-app:ci .

      - name: Validate docker-compose configuration
        run: docker compose config

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, gcp]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        working-directory: infrastructure/${{ matrix.cloud }}
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: infrastructure/${{ matrix.cloud }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure/${{ matrix.cloud }}
        run: terraform validate
